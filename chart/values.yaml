image:
  repo: ghcr.io/ackstorm/ach-channelmux
  tag: v0.4.2
  pullPolicy: IfNotPresent

imagePullSecrets: []

# REQUIRED. URL daemons use to reach the relay; the relay hands it back to
# them for the Socket Mode WebSocket (ws(s)://<publicUrl>/socket). With the
# release named "ach-channelmux" in namespace "ach": http://ach-channelmux.ach.svc
publicUrl: ""

# REQUIRED. How the relay resolves the token a daemon presents (in Coder, the
# workspace agent's CODER_AGENT_TOKEN) to its owner: GET <url> with the token in
# <header>; the owner's email is read from the JSON reply at <emailField>
# (dotted path, e.g. data.email). 401/403 or no email: rejected.
authResolver:
  url: ""
  header: ""
  emailField: email

# REQUIRED. The Slack app's credentials. The chart never creates this secret:
#   kubectl -n <ns> create secret generic ach-channelmux-slack \
#     --from-literal=app-token='xapp-…' --from-literal=bot-token='xoxb-…'
slackSecretRef:
  name: ach-channelmux-slack
  appTokenKey: app-token
  botTokenKey: bot-token

# Channels whose mentions go to an owner's daemon, as "name=owner email,…" or
# "id=owner email,…" (e.g. "dev=pepe@example.com", "C0123ABCD=pepe@example.com";
# an id survives renames and cannot be taken by a new channel). The owner may be a service account with no
# Slack user: its daemon then serves only its channels. Empty: DMs only.
channels: ""
# Of those, the channels where a mention opens a Slack code channel: "name,…" (or ids, as in channels).
codeChannels: ""

# Prometheus /metrics on port 9090 (named "metrics"): usage per owner email (messages, threads,
# commands, clicks, files, Slack calls, connections). Never exposed by the main Service or the ingress.
# With serviceMonitor.enabled, a metrics-only Service and a Prometheus Operator ServiceMonitor scrape it.
# The dashboard's user list comes from channelmux_daemon_connected, so it needs the scrape.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    # Extra labels, e.g. the release label your Prometheus selects ServiceMonitors by.
    labels: {}
  # Grafana dashboard (chart/dashboards/) as a ConfigMap for the Grafana sidecar. labels must match the
  # sidecar's label; annotations place it in a folder, e.g. {grafana_folder: "100 - Application - ACH Agents"}
  # (the sidecar needs folderAnnotation=grafana_folder). Its LLM panels read LiteLLM's Prometheus metrics.
  dashboards:
    enabled: false
    labels: {grafana_dashboard: "1"}
    annotations: {}

resources: {}
extraEnv: []

ingress:
  enabled: false
  className: ""
  host: ""
  # The daemons keep a WebSocket open; the relay pings every 10 s, under the
  # usual 60 s proxy read timeout, so no WebSocket-specific annotation is needed.
  annotations: {}
  tls: []
  path: /
  pathType: Prefix
