apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ach-channelmux.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "ach-channelmux.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
